name: Metrics

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # metrics needs a personal token (STATS_TOKEN) to read data; the
      # default token only commits the result. It commits through the API,
      # so no checkout is needed.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "Update metrics"
          filename: profile/metrics.svg
          user: kleberbarilli
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # habits is off: metrics 3.34 crashes on push events that come without
          # a commit list, which the GitHub events API now does. activity is off
          # because almost all recent events are in private repos and listing
          # them would expose their names on the public profile.
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_notable: yes

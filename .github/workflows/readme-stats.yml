name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: Print a per-repo language breakdown (repo names masked)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

env:
  USER: kleberbarilli
  ORGS: "idealizer-official" # organizations whose repos count when the user has commits there; space separated

# one run at a time, so two runs never race each other on the push
concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STATS_TOKEN is optional: a classic PAT with the "repo" scope makes
      # private contributions count. Without it the default token is used.
      #
      # role= makes the cards look at every repo the user can see as owner,
      # collaborator or organization member. The cards have no "only repos I
      # committed to" filter, so the step below builds an exclude list: it
      # keeps the user's own repos plus the repos in ORGS where the user has
      # at least one commit on the default branch, and excludes the rest.
      - name: Select organization repos
        id: repos
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api graphql --paginate -f login="$USER" -f query='
            query($login: String!, $endCursor: String) {
              user(login: $login) {
                repositories(first: 100, after: $endCursor,
                  ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) {
                  pageInfo { hasNextPage endCursor }
                  nodes { name owner { login } }
                }
              }
            }' --jq '.data.user.repositories.nodes[] | "\(.owner.login)/\(.name)"' > all.txt

          : > keep.txt
          : > exclude.txt
          while IFS=/ read -r owner name; do
            lower_owner=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')
            if [ "$lower_owner" = "$USER" ]; then
              echo "$name" >> keep.txt
              continue
            fi
            if printf ' %s ' "$(printf '%s' "$ORGS" | tr '[:upper:]' '[:lower:]')" | grep -q " $lower_owner "; then
              n=$(gh api "repos/$owner/$name/commits?author=$USER&per_page=1" --jq 'length' 2>/dev/null || echo 0)
              if [ "$n" -gt 0 ]; then
                echo "$name" >> keep.txt
                continue
              fi
            fi
            echo "$name" >> exclude.txt
          done < all.txt

          sort -u keep.txt -o keep.txt
          sort -u exclude.txt -o exclude.txt
          # exclude_repo matches by name only, so never exclude a name we keep
          comm -23 exclude.txt keep.txt > final.txt
          list=$(paste -sd, - < final.txt)
          # the list may contain private repo names: keep it out of the public log
          if [ -n "$list" ]; then echo "::add-mask::$list"; fi
          echo "exclude=$list" >> "$GITHUB_OUTPUT"
          echo "repos visible: $(wc -l < all.txt), kept: $(wc -l < keep.txt), excluded: $(wc -l < final.txt)"
          rm -f all.txt keep.txt exclude.txt final.txt

      - name: Debug repo breakdown
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api graphql --paginate -f login="$USER" -f query='
            query($login: String!, $endCursor: String) {
              user(login: $login) {
                repositories(first: 100, after: $endCursor,
                  ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    name owner { login } isFork isPrivate isArchived diskUsage
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      totalSize edges { size node { name } }
                    }
                  }
                }
              }
            }' --jq '.data.user.repositories.nodes[] | [.owner.login, .name, .isFork, .isPrivate, .isArchived, .diskUsage, .languages.totalSize, ([.languages.edges[] | "\(.node.name)=\(.size)"] | join(";"))] | @tsv' > repos.tsv
          # mask every repo and org name before printing anything
          cut -f2 repos.tsv | sort -u | while read -r n; do [ "${#n}" -ge 3 ] && echo "::add-mask::$n"; done
          cut -f1 repos.tsv | sort -u | while read -r n; do
            [ "$(printf '%s' "$n" | tr '[:upper:]' '[:lower:]')" != "$USER" ] && echo "::add-mask::$n"
          done
          i=0
          echo "idx owner repo fork private archived diskKB langBytes commitsByUser languages"
          while IFS=$'\t' read -r owner name fork priv arch disk total langs; do
            i=$((i+1))
            n=$(gh api "repos/$owner/$name/commits?author=$USER&per_page=1" --jq 'length' 2>/dev/null || echo 0)
            echo "$i $owner $name $fork $priv $arch $disk $total $n $langs"
          done < repos.tsv
          rm -f repos.tsv

          # same thing seen from the organization side: every repo the token can
          # see there, with how the user's permission is granted
          for org in $ORGS; do
            echo "::add-mask::$org"
            echo "--- org repos (listed via the organization, not via user affiliation)"
            echo "idx repo private fork archived viewerPermission javaBytes topLanguage"
            gh api graphql --paginate -f org="$org" -f query='
              query($org: String!, $endCursor: String) {
                organization(login: $org) {
                  repositories(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      name isPrivate isFork isArchived viewerPermission
                      languages(first: 1, orderBy: {field: SIZE, direction: DESC}) { edges { size node { name } } }
                      java: languages(first: 10, orderBy: {field: SIZE, direction: DESC}) { edges { size node { name } } }
                    }
                  }
                }
              }' --jq '.data.organization.repositories.nodes[] | [.name, .isPrivate, .isFork, .isArchived, .viewerPermission, (([.java.edges[] | select(.node.name == "Java") | .size] | add) // 0), ((.languages.edges[0] | "\(.node.name)=\(.size)") // "-")] | @tsv' > org.tsv || true
            cut -f1 org.tsv | sort -u | while read -r n; do [ "${#n}" -ge 3 ] && echo "::add-mask::$n"; done
            i=0
            while IFS=$'\t' read -r name priv fork arch perm java top; do
              i=$((i+1)); echo "$i $name $priv $fork $arch $perm $java $top"
            done < org.tsv
            rm -f org.tsv
          done

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kleberbarilli&show_icons=true&theme=dracula&include_all_commits=true&show=reviews,prs_merged,prs_merged_percentage&role=OWNER,COLLABORATOR,ORGANIZATION_MEMBER&exclude_repo=${{ steps.repos.outputs.exclude }}
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # The stock card lists repos through the user's affiliations, which leaves
      # out the organization repos an owner can see. This script gathers the
      # repos itself (own repos + ORGS repos with a commit by the user) and
      # renders the card with the same renderer.
      - name: Generate top languages card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          THEME: dracula
          LAYOUT: compact
          LANGS_COUNT: "10"
          HIDE: html,css
          OUT: profile/top-langs.svg
        run: |
          set -euo pipefail
          CORE_DIR=$(mktemp -d)
          printf '{"private":true,"type":"module"}' > "$CORE_DIR/package.json"
          npm install --prefix "$CORE_DIR" --no-save --no-package-lock --ignore-scripts \
            @stats-organization/github-readme-stats-core@2.2.1 > /dev/null
          CORE_DIR="$CORE_DIR" node .github/scripts/top-langs.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          # main may have moved since checkout (a push while the run was going)
          git pull --rebase origin main
          git push

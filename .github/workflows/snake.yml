name: Contribution snake

on:
  schedule:
    - cron: "41 4 * * *" # daily, 04:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: readme-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # colors follow the highcontrast theme of the other cards:
      # cyan dots for contributions, yellow snake
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kleberbarilli
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake.svg?color_snake=#e7f216&color_dots=#1b1b1b,#005c5c,#008c8c,#00c2c2,#00ffff

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/snake.svg
          git commit -m "Update contribution snake" || exit 0
          # main may have moved since checkout: rebase and retry a few times
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"; sleep 10
          done
          exit 1
